<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Приоритизация финансовых целей и расчёт ежемесячного взноса — без регистрации и передачи данных.">
  <title>Мои финансовые цели</title>
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
  <header class="topbar"><button id="brand">Мои финансовые цели</button><span><i></i> Данные остаются на устройстве</span></header>
  <main id="app"></main>
  <script src="../financial-start/html2pdf.bundle.min.js"></script>
  <script>
const ideas=[
  ["Недвижимость",["Первоначальный взнос","Квартира для себя","Недвижимость для дохода"]],
  ["Крупные покупки",["Автомобиль","Ремонт","Техника"]],
  ["Образование",["Образование детей","Новое образование","Повышение квалификации"]],
  ["Качество жизни",["Путешествие","Крупный семейный проект"]],
  ["Бизнес",["Запуск бизнеса","Развитие бизнеса"]],
  ["Капитал",["Капитал для пассивного дохода","Капитал детям"]]
];
const storageKey="financial-goals-v1";
const format=new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
let state={screen:"home",selected:[],customIdeas:[],goals:[],queue:[],editing:null,inflation:7,growth:14,reflection:""};
const app=document.getElementById("app");
function load(){try{const saved=JSON.parse(localStorage.getItem(storageKey)||"{}");state={...state,...saved,screen:"home",queue:[],editing:null};}catch{}}
function save(){localStorage.setItem(storageKey,JSON.stringify({...state,screen:"home",queue:[],editing:null}));}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function yearsText(v){const n=Number(v);return Number.isInteger(n)?`${n} ${n%10===1&&n%100!==11?"год":n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?"года":"лет"}`:`${n} лет`;}
function calc(goal){const futureCost=goal.cost*(1+state.inflation/100)**goal.years;const futureSaved=goal.saved*(1+state.growth/100)**goal.years;const months=Math.round(goal.years*12);const monthlyRate=(1+state.growth/100)**(1/12)-1;const factor=monthlyRate===0?months:((1+monthlyRate)**months-1)/monthlyRate;return{goal,futureCost,futureSaved,monthly:Math.max(0,(futureCost-futureSaved)/factor),months};}
function shell(body,step=""){app.innerHTML=`<section class="screen">${step?`<div class="progress"><span>${step}</span><b>Данные сохраняются автоматически</b></div>`:""}${body}</section>`;}
function render(){save();if(state.screen==="home")return home();if(state.screen==="ideas")return bank();if(state.screen==="form")return form();if(state.screen==="summary")return summary();}
function home(){shell(`<div class="hero"><section class="hero-main"><h1>Мои финансовые цели</h1><p class="lead">Соберите идеи, выберите приоритетные цели и узнайте расчётный ежемесячный взнос для каждой из них.</p><button class="primary" id="start">${state.goals.length||state.selected.length?"Продолжить работу":"Начать с банка идей"} →</button><div class="note"><strong>Без регистрации и передачи данных.</strong><br>Все значения сохраняются только в браузере этого устройства.</div></section><aside class="hero-side"><h2>Что вы сделаете</h2><ol><li>Соберёте идеи финансовых целей.</li><li>Выберете приоритеты без жёсткого лимита.</li><li>Укажете стоимость, срок и уже накопленную сумму.</li><li>Получите расчёт взноса и сможете скачать результат.</li></ol></aside></div>`);document.getElementById("start").onclick=()=>{state.screen="ideas";render()};}
function bank(){const all=[...ideas,["Мои идеи",state.customIdeas]];shell(`<div class="head"><p class="eyebrow">Шаг 1</p><h1>Банк идей</h1><p>Можно выбрать одну идею несколько раз. Для первого цикла рекомендуем сфокусироваться максимум на трёх целях, но жёсткого ограничения нет.</p></div><div class="workspace"><section><div class="idea-groups">${all.map(([cat,list])=>`<div class="idea-group"><h2>${cat}</h2><div class="idea-list">${list.map(name=>`<button class="idea" data-name="${esc(name)}"><span>${esc(name)}</span><small>Выбрать цель</small></button>`).join("")||"<p class='muted'>Добавьте свою идею ниже.</p>"}</div></div>`).join("")}</div><form id="custom" class="custom"><label>Своя идея<input name="name" maxlength="80" placeholder="Например, семейное путешествие"></label><button class="secondary">Добавить идею</button></form></section><aside class="selected"><h2>Выбрано для заполнения</h2><p>${state.selected.length?`${state.selected.length} ${state.selected.length===1?"цель":"цели"}`:"Пока ничего не выбрано"}</p><div>${state.selected.map((name,i)=>`<div class="selected-row"><span>${esc(name)}</span><button data-remove="${i}" aria-label="Убрать ${esc(name)}">×</button></div>`).join("")}</div><button class="primary wide" id="fill" ${state.selected.length?"":"disabled"}>Заполнить параметры →</button>${state.goals.length?`<button class="secondary wide" id="results">К сохранённым целям</button>`:""}</aside></div>`,`1 из 3`);
document.querySelectorAll(".idea").forEach(b=>b.onclick=()=>{state.selected.push(b.dataset.name);render()});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.selected.splice(Number(b.dataset.remove),1);render()});document.getElementById("custom").onsubmit=e=>{e.preventDefault();const name=new FormData(e.currentTarget).get("name").trim();if(!name)return;if(!state.customIdeas.includes(name))state.customIdeas.push(name);state.selected.push(name);render()};document.getElementById("fill").onclick=()=>{state.queue=[...state.selected];state.editing=null;state.screen="form";render()};const res=document.getElementById("results");if(res)res.onclick=()=>{state.screen="summary";render()};}
function form(){const existing=state.editing!==null?state.goals.find(g=>g.id===state.editing):null;const name=existing?.name||state.queue[0]||"";if(!name){state.screen="summary";return render()}shell(`<div class="head"><p class="eyebrow">Шаг 2</p><h1>${existing?"Изменить цель":"Из желания — в финансовую цель"}</h1><p>${existing?"Поля заполнены сохранёнными данными.":`Сейчас заполняем: <strong>${esc(name)}</strong>. После сохранения останется: ${Math.max(0,state.queue.length-1)}.`}</p></div><form class="goal-form" id="goalForm"><label>Название<input name="name" required maxlength="80" value="${esc(name)}"></label><label>Почему это важно? <em>необязательно</em><input name="why" maxlength="180" value="${esc(existing?.why||"")}" placeholder="Коротко зафиксируйте личный смысл"></label><div class="fields"><label>Стоимость цели сегодня, ₽<input name="cost" type="number" min="1" max="1000000000000" step="1" required value="${existing?.cost??""}" placeholder="Введите сумму"><small>От 1 ₽ до 1 трлн ₽</small></label><label>Срок до цели, лет<input name="years" type="number" min="0.1" max="50" step="0.1" required value="${existing?.years??""}" placeholder="Например, 5"><small>От 0,1 до 50 лет</small></label><label>Уже отложено, ₽ <em>необязательно</em><input name="saved" type="number" min="0" max="1000000000000" step="1" value="${existing?.saved??""}" placeholder="0"></label><label>Приоритет<select name="priority"><option ${existing?.priority==="Высокий"?"selected":""}>Высокий</option><option ${existing?.priority==="Средний"?"selected":""}>Средний</option><option ${existing?.priority==="Низкий"?"selected":""}>Низкий</option></select></label></div><p class="error" id="error"></p><div class="actions"><button type="button" class="secondary" id="cancel">Назад</button><button class="primary">Сохранить цель</button></div></form>`,`2 из 3`);
document.getElementById("cancel").onclick=()=>{state.screen=existing?"summary":"ideas";render()};document.getElementById("goalForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),goal={id:existing?.id||Date.now()+Math.random(),name:f.get("name").trim(),why:f.get("why").trim(),cost:Number(f.get("cost")),years:Number(f.get("years")),saved:Number(f.get("saved")||0),priority:f.get("priority")};let err="";if(!goal.name)err="Укажите название цели.";else if(!Number.isFinite(goal.cost)||goal.cost<1||goal.cost>1e12)err="Исправьте стоимость цели: допустима сумма от 1 ₽ до 1 трлн ₽.";else if(!Number.isFinite(goal.years)||goal.years<.1||goal.years>50)err="Исправьте срок: допустимо от 0,1 до 50 лет.";else if(!Number.isFinite(goal.saved)||goal.saved<0||goal.saved>1e12)err="Исправьте уже накопленную сумму: допустимо от 0 ₽ до 1 трлн ₽.";if(err){document.getElementById("error").textContent=err;return}if(existing){state.goals=state.goals.map(g=>g.id===existing.id?goal:g);state.editing=null;state.screen="summary"}else{state.goals.push(goal);state.queue.shift();state.selected.shift();state.screen=state.queue.length?"form":"summary"}render()};}
function summary(){const valid=Number.isFinite(state.inflation)&&state.inflation>=0&&state.inflation<=100&&Number.isFinite(state.growth)&&state.growth>=0&&state.growth<=100;const rows=valid?state.goals.map(calc):[];const total=rows.reduce((s,r)=>s+r.monthly,0);const order={"Высокий":0,"Средний":1,"Низкий":2};const sorted=[...rows].sort((a,b)=>order[a.goal.priority]-order[b.goal.priority]);shell(`<div id="pdf"><header class="result-hero"><p class="eyebrow">Результат</p><h1>Мой план финансовых целей</h1><p>Расчёт показывает ориентир для планирования, а не обещание будущей доходности.</p></header><div class="result-shell"><div class="rates"><label>Инфляция, % в год<input id="inflation" type="number" min="0" max="100" step="0.1" value="${state.inflation}"><small>Задано системой, можно изменить</small></label><label>Сценарная доходность, % в год<input id="growth" type="number" min="0" max="100" step="0.1" value="${state.growth}"><small>Сценарий, не прогноз и не гарантия</small></label></div><aside class="inflation"><strong>Проверьте ориентир по инфляции</strong><p>Сравните официальную инфляцию со своей персональной — она зависит от структуры расходов.</p><a href="https://fincult.info/calc/inflation/" target="_blank" rel="noopener">Рассчитать персональную инфляцию ↗</a></aside>${!valid?`<p class="error">Инфляция и доходность должны быть числами от 0 до 100%.</p>`:""}${!state.goals.length?`<div class="empty"><b>Добавьте хотя бы одну цель</b></div>`:`<div class="total"><span>Суммарный расчётный взнос на старте</span><strong>${format.format(total)} ₽/мес.</strong><small>Предполагается, что накопление на все цели начинается одновременно.</small></div><h2>Цели в порядке приоритета</h2><div class="calc-list">${sorted.map((r,i)=>`<article><div class="calc-title"><div><span class="tag">${esc(r.goal.priority)} · ${i+1}</span><h3>${esc(r.goal.name)}</h3><small>${yearsText(r.goal.years)}</small></div><button data-edit="${r.goal.id}">Изменить</button></div><div class="metrics"><div><span>Стоимость сегодня</span><b>${format.format(r.goal.cost)} ₽</b></div><div><span>Будущая стоимость</span><b>${format.format(r.futureCost)} ₽</b></div><div><span>Накопленное к сроку</span><b>${format.format(r.futureSaved)} ₽</b></div><div class="accent"><span>Нужно в месяц</span><b>${format.format(r.monthly)} ₽/мес.</b></div></div><p class="explain">Расчёт учитывает инфляцию ${state.inflation}% и эффективную годовую доходность ${state.growth}%. Месячная ставка: (1 + годовая ставка)<sup>1/12</sup> − 1; взносы предполагаются в конце месяца.</p><button class="delete" data-delete="${r.goal.id}">Удалить цель</button></article>`).join("")}</div>`}<div class="reflection"><h2>Какой следующий шаг реалистичен?</h2><div>${["Расчёт соответствует моим ожиданиям","Нужно уточнить стоимость цели","Нужно пересмотреть срок","Цели лучше реализовывать последовательно","Нужно изменить приоритеты"].map(v=>`<button class="${state.reflection===v?"selected":""}" data-ref="${v}">${v}</button>`).join("")}</div></div><p class="disclaimer">Расчёт носит образовательный характер и не является индивидуальной инвестиционной рекомендацией.</p></div></div><div class="result-actions"><button class="primary" id="pdfBtn">Скачать результат в PDF</button><button class="secondary" id="add">Добавить или выбрать цели</button></div><p id="status" class="muted"></p>`,`3 из 3`);
document.getElementById("inflation").onchange=e=>{state.inflation=Number(e.target.value);render()};document.getElementById("growth").onchange=e=>{state.growth=Number(e.target.value);render()};document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{state.editing=Number(b.dataset.edit);state.screen="form";render()});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{if(confirm("Удалить эту цель?")){state.goals=state.goals.filter(g=>g.id!==Number(b.dataset.delete));render()}});document.querySelectorAll("[data-ref]").forEach(b=>b.onclick=()=>{state.reflection=b.dataset.ref;render()});document.getElementById("add").onclick=()=>{state.screen="ideas";render()};document.getElementById("pdfBtn").onclick=downloadPdf;}
async function downloadPdf(){const btn=document.getElementById("pdfBtn"),status=document.getElementById("status");btn.disabled=true;status.textContent="Формируем PDF…";try{const date=new Date().toLocaleDateString("ru-RU").replaceAll(".","-");await html2pdf().set({margin:9,filename:`Мои_финансовые_цели_${date}.pdf`,image:{type:"jpeg",quality:.96},html2canvas:{scale:2,backgroundColor:"#fff",useCORS:true},jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},pagebreak:{mode:["css","legacy"]}}).from(document.getElementById("pdf")).save();status.textContent="PDF скачан на устройство."}catch{status.textContent="Не удалось создать PDF. Обновите страницу и попробуйте снова."}finally{btn.disabled=false}}
document.getElementById("brand").onclick=()=>{state.screen="home";render()};load();render();
  </script>
</body>
</html>
